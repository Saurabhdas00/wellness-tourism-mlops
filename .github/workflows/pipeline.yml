name: Tourism Project MLOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. Register Dataset
  # ============================================================
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas huggingface_hub

      - name: Upload Dataset to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(
              token=os.environ["HF_TOKEN"]
          )

          api.upload_file(
              path_or_fileobj="tourism_project/data/tourism.csv",
              path_in_repo="tourism.csv",
              repo_id="urgay/tourism-dataset",
              repo_type="dataset"
          )

          print("Dataset uploaded successfully.")
          PY


  # ============================================================
  # 2. Data Preparation
  # ============================================================
  data-prep:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas==2.2.3 \
            numpy==2.1.3 \
            scikit-learn==1.6.1 \
            joblib==1.6.0

      - name: Run Data Preparation
        run: |
          python tourism_project/deployment/data_preparation.py

      - name: Verify Prepared Data
        run: |
          test -f tourism_project/data/pipeline_artifacts/prepared_data.joblib
          test -f tourism_project/data/pipeline_artifacts/preparation_metadata.json
          echo "Prepared data artifacts created successfully."

      - name: Upload Prepared Data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: tourism_project/data/pipeline_artifacts/


  # ============================================================
  # 3. Model Training and MLflow
  # ============================================================
  model-training:
    name: Model Training and MLflow
    needs: data-prep
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas==2.2.3 \
            numpy==2.1.3 \
            scikit-learn==1.6.1 \
            joblib==1.6.0 \
            xgboost \
            mlflow \
            skops

      - name: Download Prepared Data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: tourism_project/data/pipeline_artifacts/

      - name: Train and Evaluate Model
        run: |
          python tourism_project/deployment/train_model.py

      - name: Verify Model Artifacts
        run: |
          test -f tourism_project/model_building/final_model.pkl
          test -f tourism_project/model_building/preprocessor.pkl
          test -f tourism_project/model_building/final_metrics.json
          test -f tourism_project/model_building/model_info.json
          test -f tourism_project/model_building/mlflow.db
          test -f tourism_project/model_building/baseline_results.csv
          test -f tourism_project/model_building/tuned_results.csv
          test -f tourism_project/model_building/confusion_matrix.json

          echo "All model artifacts created successfully."

      - name: Display Final Metrics
        run: |
          echo "Final Model Metrics:"
          cat tourism_project/model_building/final_metrics.json

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            tourism_project/model_building/final_model.pkl
            tourism_project/model_building/preprocessor.pkl
            tourism_project/model_building/final_metrics.json
            tourism_project/model_building/model_info.json
            tourism_project/model_building/mlflow.db
            tourism_project/model_building/baseline_results.csv
            tourism_project/model_building/tuned_results.csv
            tourism_project/model_building/confusion_matrix.json


  # ============================================================
  # 4. Deployment and Hosting Validation
  # ============================================================
  deploy-hosting:
    name: Deploy and Validate Hosting
    needs: model-training
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: tourism_project/model_building/

      - name: Install Deployment Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt

      - name: Copy Final Model to Deployment
        run: |
          cp tourism_project/model_building/final_model.pkl \
             tourism_project/deployment/final_model.pkl

          cp tourism_project/model_building/preprocessor.pkl \
             tourism_project/deployment/preprocessor.pkl

      - name: Validate Deployment Files
        run: |
          test -f tourism_project/deployment/app.py
          test -f tourism_project/deployment/requirements.txt
          test -f tourism_project/deployment/final_model.pkl
          test -f tourism_project/deployment/preprocessor.pkl
          test -f tourism_project/deployment/data_preparation.py
          test -f tourism_project/deployment/train_model.py

          echo "All deployment files are present."

      - name: Validate Streamlit Application
        run: |
          python -m py_compile tourism_project/deployment/app.py

          echo "Streamlit application validation completed."

      - name: Commit Updated Model and Deployment Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tourism_project/model_building/
          git add tourism_project/deployment/final_model.pkl
          git add tourism_project/deployment/preprocessor.pkl

          if git diff --cached --quiet; then
            echo "No deployment changes to commit."
          else
            git commit -m "Update model and deployment artifacts [skip ci]"
            git push
          fi