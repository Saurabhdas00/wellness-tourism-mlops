name: Tourism Project MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:

  # Register dataset
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas huggingface_hub

      - name: Upload Dataset to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])

          api.upload_file(
              path_or_fileobj="tourism_project/data/tourism.csv",
              path_in_repo="tourism.csv",
              repo_id="urgay/tourism-dataset",
              repo_type="dataset"
          )

          print("Dataset uploaded successfully.")
          PY

  # Validate deployment
  validate-deployment:
    name: Validate Deployment
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/deployment/requirements.txt

      - name: Validate Deployment Files
        run: |
          python - <<'PY'
          from pathlib import Path

          deployment_dir = Path("tourism_project/deployment")

          required_files = [
              "app.py",
              "requirements.txt",
              "final_model.pkl",
              "preprocessor.pkl"
          ]

          for filename in required_files:
              path = deployment_dir / filename

              if not path.exists():
                  raise FileNotFoundError(
                      f"Missing deployment file: {path}"
                  )

              print(f"Found: {path}")

          print("All deployment files are present.")
          PY